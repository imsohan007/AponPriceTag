<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>আপন বাজার - প্রাইস ট্যাগ</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@600;700&display=swap" rel="stylesheet">
<style>
  /* নিকষ ফন্ট: Nikosh.ttf ফাইলটি index.html এর পাশের ফোল্ডারে রাখুন (অথবা পিসিতে ইনস্টল থাকলেই হবে) */
  @font-face {
    font-family: 'NikoshTag';
    src: local('Nikosh'), local('NikoshBAN'), local('Nikosh Bangla'),
         url('Nikosh.ttf') format('truetype'), url('NikoshBAN.ttf') format('truetype');
    font-weight: 400 900;
  }
  :root { --tag-w: 2.83in; --tag-h: 1.6in; --txt: 'Hind Siliguri', 'Noto Sans Bengali', 'Kalpurush', sans-serif; --bn: 'NikoshTag', 'Nikosh', 'NikoshBAN', 'Kalpurush', 'Noto Sans Bengali', sans-serif; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 16px; background: #e9e9e9; font-family: var(--txt); }
  .panel {
    max-width: 460px; margin: 0 auto 16px; background: #fff; padding: 14px;
    border-radius: 10px; display: grid; gap: 10px;
  }
  .panel label { font-weight: 700; font-size: 15px; display: grid; gap: 4px; }
  .panel input {
    font-size: 20px; padding: 8px 10px; border: 2px solid #222; border-radius: 8px; font-family: inherit;
  }
  .panel button {
    font-size: 17px; font-weight: 700; padding: 10px; border: 0; border-radius: 8px;
    background: #111; color: #fff; cursor: pointer; font-family: inherit;
  }
  .seg { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .seg button { background: #fff; color: #111; border: 2px solid #111; }
  .seg button.on { background: #111; color: #fff; }

  /* ===== TAG ===== */
  .tag {
    position: relative; width: 460px; aspect-ratio: 1456 / 824; margin: 0 auto;
    background: #000; color: #000; overflow: hidden; container-type: inline-size;
    font-family: var(--txt);
    -webkit-print-color-adjust: exact; print-color-adjust: exact;
  }
  .box { position: absolute; background: #fff; border-radius: 4cqw; display: flex; align-items: center; overflow: hidden; }
  .b1 { left: 2.7%; top: 7.3%; width: 72.3%; height: 24%; }
  .b2 { left: 2.7%; top: 35.4%; width: 72.5%; height: 24%; }
  .b3 { left: 76.4%; top: 7.3%; width: 20.8%; height: 52.2%; flex-direction: column; justify-content: flex-start; }
  .label { font-weight: 700; font-size: 6.3cqw; white-space: nowrap; margin-left: 4.5cqw; line-height: 1; }
  .num {
    flex: 1; min-width: 0; text-align: center; margin: 0 2cqw 0 0;
    font-family: 'Arial Black', Impact, 'Helvetica Neue', Arial, sans-serif;
    font-weight: 900; font-style: italic; font-size: 16cqw; line-height: 1;
    letter-spacing: -0.3cqw; white-space: nowrap;
  }
  .p-title { font-weight: 700; font-size: 3.1cqw; margin-top: 1cqw; white-space: nowrap; line-height: 1.1; }
  .p-sign {
    font-family: 'Arial Black', Impact, Arial, sans-serif; font-weight: 900; font-style: italic;
    font-size: 8cqw; line-height: 1; margin-top: 0.5cqw;
  }
  .p-num {
    align-self: stretch; width: 100%; min-width: 0; text-align: center; margin: 3.2cqw 0 0 0;
    font-family: 'Arial Black', Impact, Arial, sans-serif; font-weight: 900;
    font-size: 12cqw; line-height: 1; white-space: nowrap;
  }
  /* বাংলা অঙ্ক = নিকষ ফন্ট */
  .tag.bn .num, .tag.bn .p-num {
    font-family: var(--bn); font-style: normal; font-weight: 700;
    -webkit-text-stroke: 0.7cqw #000; letter-spacing: 0;
  }
  .tag.bn .num { font-size: 21.5cqw; }
  .tag.bn .p-num { font-size: 14.5cqw; -webkit-text-stroke: 0.5cqw #000; }
  .tag.bn .p-sign { font-style: normal; }

  .logo { position: absolute; left: 2.5cqw; top: 35.2cqw; width: 41.5cqw; height: auto; fill: #fff; }
  .slogan {
    position: absolute; left: 50%; top: 67%; color: #fff; font-weight: 700;
    font-size: 5.4cqw; line-height: 1.35; white-space: nowrap;
  }

  /* ===== PRINT: 2.83in x 1.6in ===== */
  @page { size: auto; margin: 0; }
  @media print {
    html, body { width: var(--tag-w); height: var(--tag-h); margin: 0; padding: 0; background: #fff; }
    .panel { display: none; }
    .tag { width: var(--tag-w); height: var(--tag-h); margin: 0; page-break-after: avoid; }
  }
</style>
</head>
<body>

<div class="panel">
  <label>বাজার মূল্য
    <input type="text" id="market" value="150" inputmode="decimal" autocomplete="off" enterkeyhint="next">
  </label>
  <label>আপন মূল্য
    <input type="text" id="own" value="145" inputmode="decimal" autocomplete="off" enterkeyhint="next">
  </label>
  <div class="seg">
    <button type="button" id="langEn">1 2 3 English</button>
    <button type="button" id="langBn" class="on">১ ২ ৩ বাংলা</button>
  </div>
  <button id="printBtn" onclick="window.print()">🖨️ প্রিন্ট করুন</button>
</div>

<div class="tag bn" id="tag">

  <div class="box b2"><span class="label">আপন মূল্যঃ</span><span class="num" id="vOwn"></span></div>
  <div class="box b3">
    <div class="p-title">পার্সেন্টেজ</div>
    <div class="p-sign">%</div>
    <div class="p-num" id="vPct"></div>
  </div>

  <div class="slogan">আপনে বাজার করুন<br>বাজার খরচ কমান ।</div>
</div>

<script>
  const $ = id => document.getElementById(id);
  const fmt = n => Number.isInteger(n) ? String(n) : String(+n.toFixed(2));

  let lang = 'bn';
  try { lang = localStorage.getItem('numLang') || 'bn'; } catch (e) {}

  const toBn = s => s.replace(/[0-9]/g, d => '০১২৩৪৫৬৭৮৯'[d]);
  const conv = s => lang === 'bn' ? toBn(s) : s;

  function parseNum(v) {
    const bn = '০১২৩৪৫৬৭৮৯';
    v = v.replace(/[০-৯]/g, d => bn.indexOf(d)).replace(/[।,]/g, '.').replace(/[^0-9.]/g, '');
    return parseFloat(v);
  }

  /* সংখ্যা বক্সের প্রস্থ ও উচ্চতায় ঢোকানো (স্ট্রোকসহ) */
  const cv = document.createElement('canvas').getContext('2d');
  function fitGlyph(el, capCqw, availW, availH) {
    const cq = $('tag').clientWidth / 100;
    el.style.fontSize = capCqw + 'cqw';
    const text = el.textContent;
    if (!text) return;
    const cs = getComputedStyle(el);
    cv.font = cs.fontStyle + ' ' + cs.fontWeight + ' 100px ' + cs.fontFamily;
    const m = cv.measureText(text);
    const w100 = m.width || 1;
    const h100 = (m.actualBoundingBoxAscent + m.actualBoundingBoxDescent) || 70;
    const stroke = parseFloat(cs.webkitTextStrokeWidth) || 0;
    const s = Math.min((availW - stroke) * 100 / w100, (availH - stroke) * 100 / h100, capCqw * cq);
    el.style.fontSize = Math.max(s / cq, 2) + 'cqw';
  }

  function update() {
    const bn = lang === 'bn';
    const m = parseNum($('market').value);
    const o = parseNum($('own').value);

    const setNum = (el, v) => {
      el.textContent = isNaN(v) ? '' : conv(fmt(v));
      fitGlyph(el, bn ? 21.5 : 16, el.clientWidth * 0.94, el.parentElement.clientHeight * 0.88);
    };
    setNum($('vMarket'), m);
    setNum($('vOwn'), o);

    let pct = '';
    if (!isNaN(m) && !isNaN(o) && m > 0) pct = String(+(((m - o) / m) * 100).toFixed(1));
    const vp = $('vPct');
    vp.textContent = conv(pct);
    fitGlyph(vp, bn ? 14.5 : 12, vp.clientWidth * 0.9, (vp.parentElement.clientHeight - vp.offsetTop) * 0.9);
  }

  function setLang(l) {
    lang = l;
    try { localStorage.setItem('numLang', l); } catch (e) {}
    $('tag').classList.toggle('bn', l === 'bn');
    $('langEn').classList.toggle('on', l === 'en');
    $('langBn').classList.toggle('on', l === 'bn');
    update();
  }

  $('langEn').addEventListener('click', () => setLang('en'));
  $('langBn').addEventListener('click', () => setLang('bn'));
  $('market').addEventListener('input', update);
  $('own').addEventListener('input', update);
  setLang(lang);

  $('market').addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); $('own').focus(); $('own').select(); }
  });
  $('own').addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); $('printBtn').focus(); }
  });

  if (document.fonts) {
    document.fonts.load("700 100px NikoshTag", "০১২৩৪৫৬৭৮৯").then(update).catch(() => {});
    document.fonts.ready.then(update);
  }
  window.addEventListener('resize', update);

  $('market').focus(); $('market').select();
</script>
</body>
</html>
